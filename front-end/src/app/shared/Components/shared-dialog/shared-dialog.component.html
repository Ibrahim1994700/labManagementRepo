<p-dialog
  [(visible)]="visible"
  [modal]="true"
  [draggable]="false"
  [resizable]="false"
  [closable]="true"
  [style]="{ width: '450px' }"
  styleClass="custom-dialog"
  (onHide)="onDialogClose()"
>
  <!-- HEADER -->
  <ng-template pTemplate="header">
    <div class="dialog-header">
      <h3>{{ header }}</h3>
    </div>
  </ng-template>

  <!-- BODY -->
  <div class="dialog-body" [formGroup]="formGroup">

    <p class="subtitle">الرجاء إدخال معلومات المريض</p>

    <div class="form-grid">
      <div class="field" *ngFor="let input of listOfInputs">

        <label>{{ input.label }}</label>

        <input
          [type]="input.inputType"
          class="input-field"
          [formControlName]="input.formControlName"
          [placeholder]="input.placeHolder"
        />

      </div>
    </div>

  </div>

  <!-- FOOTER -->
  <ng-template pTemplate="footer">
    <div class="dialog-footer">

      <button
        pButton
        label="إلغاء"
        class="p-button-secondary"
        (click)="onDialogClose()"
      ></button>

      <button
        pButton
        label="حفظ"
        class="p-button-success"
        [disabled]="!formGroup.valid"
        (click)="saveProfile()"
      ></button>

    </div>
  </ng-template>
</p-dialog>
